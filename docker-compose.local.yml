services:
  openbiliclaw-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbiliclaw-backend
    environment:
      OPENBILICLAW_PROJECT_ROOT: /app/runtime
      OPENBILICLAW_CONFIG_TEMPLATE: /app/config.example.toml
      # Local profile: never inject HTTP_PROXY / HTTPS_PROXY automatically.
      OPENBILICLAW_DISABLE_PROXY: "1"
      # Bilibili-only local profile: disable Xiaohongshu task production,
      # task pickup, and passive XHS ingest endpoints.
      OPENBILICLAW_NO_XHS: "1"
      # Optional switch if you do not want browser-assisted Douyin imports.
      # OPENBILICLAW_NO_DOUYIN: "1"
    command:
      - python
      - -m
      - openbiliclaw.docker_runtime
      - openbiliclaw
      - serve-api
      - --host
      - 0.0.0.0
      - --port
      - "8420"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8420:8420"
    volumes:
      - /Users/shiki/data/openbiliclaw:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8420/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
